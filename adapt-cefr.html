<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Adapt-CEFR</title>
<style>
:root{--bg:#F6F5F1;--card:#FFFFFF;--line:#E2E0D8;--line2:#C9C7BF;--ink:#1F1E1B;--ink2:#3D3D3A;--muted:#5C5A55;--accent:#1D4ED8;--accentDark:#1E3A8A;--okBg:#E3F2E8;--ok:#1E6B3A;--warnBg:#FDF0D5;--warn:#8A4B00;--errBg:#FCE8E6;--err:#B42318;--chip:#ECEAE4}
*{box-sizing:border-box}
html{overflow-y:scroll;scrollbar-gutter:stable}
.bar{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.barIn{max-width:1440px;margin:0 auto;padding:8px 28px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
button,input,textarea,select{font-family:inherit;font-size:13px}
.wrap{max-width:1440px;margin:0 auto;padding:18px 28px 40px;display:flex;flex-direction:column;gap:14px}

.brand{font-weight:700;font-size:16px;background:none;border:none;cursor:pointer;color:var(--ink);padding:8px 10px 8px 0}
.brand:hover{color:var(--accent)}
nav{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.nav{padding:8px 12px;border-radius:8px;border:1px solid transparent;background:none;cursor:pointer;color:var(--muted);font-size:14px;font-weight:500;line-height:20px}
.nav.on{background:var(--card);border-color:var(--line);color:var(--ink)}
.nav .n{display:inline-flex;width:20px;height:20px;border-radius:50%;align-items:center;justify-content:center;background:var(--chip);color:var(--ink2);font-size:12px;margin-right:6px}
.nav.on .n{background:var(--accent);color:#fff}
.admin .nav{font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.chip{display:inline-flex;align-items:center;padding:4px 10px;border-radius:6px;background:var(--chip);color:var(--ink2);font-size:12px}
.chip.ok{background:var(--okBg);color:var(--ok)}.chip.warn{background:var(--warnBg);color:var(--warn)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.between{justify-content:space-between}
.muted{color:var(--muted);font-size:12px}
h1{margin:0;font-size:22px;font-weight:600}h2{margin:0;font-size:15px;font-weight:600}
.btn{height:40px;padding:0 16px;border-radius:8px;border:1px solid var(--line2);background:#fff;color:var(--ink2);cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--ink2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.btn.primary:hover{background:var(--accentDark)}
.btn.outline{border-color:var(--accent);color:var(--accent)}
.btn:disabled{background:#EFEEEA;border-color:#E2E0D8;color:#9B9890;cursor:not-allowed}
.opt{min-width:38px;height:36px;padding:0 10px;border-radius:8px;border:1px solid var(--line2);background:#fff;color:var(--ink2);cursor:pointer;font-weight:500}
.opt.on{background:var(--accent);border-color:var(--accent);color:#fff}
.opt:disabled{cursor:default}.opt:disabled:not(.on){color:#9B9890}
.small{height:32px;padding:0 10px;border-radius:8px;border:1px solid var(--line2);background:#fff;cursor:pointer;font-size:12px}
.small.yes{background:var(--okBg);border-color:var(--ok);color:var(--ok)}.small.no{background:var(--errBg);border-color:var(--err);color:var(--err)}
label.f,div.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
input[type=text],input[type=password],select,textarea{border:1px solid var(--line2);border-radius:8px;padding:0 10px;height:40px;background:#fff;color:var(--ink)}
textarea{padding:10px;height:auto;line-height:1.6;resize:vertical}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.stat{display:flex;flex-direction:column;gap:4px}.stat b{font-size:24px;font-weight:600}
.tabs{display:inline-flex;gap:4px;padding:4px;background:var(--chip);border-radius:10px}
.tab{height:36px;padding:0 14px;border-radius:8px;border:none;background:transparent;color:var(--muted);cursor:pointer;font-weight:500}
.tab.on{background:#fff;color:var(--ink)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:500;font-size:12px;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--line)}
td{padding:10px 12px;border-bottom:1px solid #EFEDE7;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.scroll{overflow-x:auto}
.toast{padding:10px 14px;border-radius:10px;background:var(--okBg);color:var(--ok);font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.12);border:1px solid #BFDFC9}
.err{color:var(--err);font-size:12px}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 0fr minmax(0,1fr);column-gap:6px;transition:grid-template-columns .6s ease,column-gap .6s ease;align-items:stretch}
.cols.two{grid-template-columns:repeat(2,minmax(0,1fr));column-gap:12px}
.cols.three{grid-template-columns:repeat(3,minmax(0,1fr));column-gap:12px;transition:none}
textarea.edit{resize:none;display:block;width:100%;font-size:13px;line-height:1.6;padding:10px;border:1px solid var(--line2);border-radius:8px;font-family:inherit}
.cols.open{grid-template-columns:minmax(0,1fr) minmax(0,1.15fr) minmax(0,1fr);column-gap:12px}
.ver{min-width:0;display:flex;flex-direction:column;gap:10px}
.txt{height:210px;overflow:auto;font-size:13px;line-height:1.6;white-space:pre-line}
.body{height:300px;box-sizing:border-box}
.arrow{width:32px;height:32px;border-radius:8px;border:1px solid var(--accent);background:#fff;color:var(--accent);cursor:pointer;font-size:16px;line-height:1;display:inline-flex;align-items:center;justify-content:center;padding:0}
.arrow:hover{background:#EEF3FF}
.arrow:disabled{border-color:#E2E0D8;background:#EFEEEA;color:#9B9890;cursor:not-allowed}
#your.body{resize:none;display:block;width:100%}
.mid{min-width:0;overflow:hidden;opacity:0;visibility:hidden;padding:0;border:0;border-radius:12px;background:#fff;display:flex;flex-direction:column;gap:10px;transition:opacity .35s ease .45s}
.cols.open .mid{opacity:1;visibility:visible;padding:15px;border:2px solid var(--accent)}
.crit{display:flex;flex-direction:column;gap:4px}
details summary{cursor:pointer;font-size:12px;color:var(--muted)}
.checks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;margin-top:6px;font-size:12px}
.empty{text-align:center;padding:48px 16px;color:var(--muted)}
@media (max-width:900px){.cols,.cols.two,.cols.three,.cols.open{grid-template-columns:minmax(0,1fr)!important}.mid{opacity:1;visibility:visible}.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}.grid3{grid-template-columns:minmax(0,1fr)}}
@media (prefers-reduced-motion:reduce){.cols,.mid{transition:none}}
</style>
</head>
<body>
<header class="bar"><div class="barIn">
<div class="row">
<button class="brand" id="brand" title="Back to start">Adapt-CEFR</button>
<nav aria-label="Workflow" id="mainNav"></nav>
</div>
<div class="row"><span class="chip" title="One installation per corpus language" id="langChip">French corpus</span><nav aria-label="Administration" class="admin" id="adminNav"></nav></div>
</div></header>
<div class="wrap">
<div id="toast" aria-live="polite" style="position:fixed;right:20px;bottom:20px;z-index:50;display:flex;flex-direction:column;gap:8px;max-width:440px;pointer-events:none"></div>
<main id="view"></main>
</div>

<script>
/* ---------- Sample data (mockup) ---------- */
const SAMPLE = {
  'FR-Adapt': {
    lang: 'FR', mode: 'Adapt', srcLevel: 'C1', level: 'B1', dir: 'simplification',
    srcLabel: 'Source text · « La ville de demain face au climat » · 612 words',
    src: "Confrontées à la multiplication des épisodes caniculaires, les municipalités engagent une transformation profonde de l'espace urbain : désimperméabilisation des sols, végétalisation des cours d'école, création d'îlots de fraîcheur. Si ces politiques suscitent l'adhésion d'une majorité d'habitants, leur coût et la lenteur de leur mise en œuvre alimentent néanmoins de vifs débats…",
    crit2: 'Meaning', crit2Hint: 'key information kept, no addition, no misinterpretation', target: { min: 300, max: 320, avg: 13, pmin: 3, pmax: 4, conn: ['cependant', 'pourtant', 'par conséquent', 'donc', "c'est pourquoi"] },
    judgePick: 'B',
    A: { model: 'Mistral', judgeLevel: 4, judgeDir: 'Too hard', estLevel: 'B1', estReg: 'neutral', chips: [['312 words', 1], ['11.4 / sentence', 1], ['3 paragraphs', 1], ['4 connectors', 1]],
      text: "Les villes changent. En été, il fait de plus en plus chaud et les habitants cherchent de l'ombre. Cependant, les maires ont des idées pour rafraîchir les rues.\n\nIls plantent des arbres, créent des parcs et remplacent le béton par de l'herbe. Par conséquent, la température baisse un peu dans certains quartiers.\n\nCes projets coûtent cher, mais beaucoup de villes pensent qu'ils sont nécessaires." },
    B: { model: 'Qwen', judgeLevel: 3, judgeDir: 'Too easy', estLevel: 'B1', estReg: 'neutral', chips: [['305 words', 1], ['10.8 / sentence', 1], ['5 paragraphs', 0], ['3 connectors', 1]],
      text: "Il fait de plus en plus chaud dans les villes. C'est pourquoi beaucoup de mairies plantent des arbres.\n\nElles transforment aussi les cours d'école en jardins.\n\nLes enfants peuvent jouer à l'ombre.\n\nCependant, ces projets coûtent cher.\n\nIls prennent aussi du temps." }
  },
  'FR-Generate': {
    lang: 'FR', mode: 'Generate', srcLevel: null, level: 'B2', dir: "texte d'opinion",
    srcLabel: "Brief · environnement · texte d'opinion",
    src: "Un habitant écrit au journal local pour défendre un centre-ville sans voitures le week-end.\nThème : environnement · Type : texte d'opinion · Visée : convaincre · Public : adultes.",
    crit2: 'Brief', crit2Hint: 'theme, text type and situation respected', target: { min: 400, max: 420, avg: 20, pmin: 3, pmax: 6, conn: ['de plus', 'en revanche', 'cependant', 'par conséquent'] },
    judgePick: 'A',
    A: { model: 'GPT', judgeLevel: 5, judgeDir: 'On target', estLevel: 'B2', estReg: 'semi-formal', chips: [['408 words', 1], ['17.9 / sentence', 1], ['4 paragraphs', 1], ['3 connectors', 1]],
      text: "Le mois dernier, le conseil municipal a proposé de fermer le centre-ville aux voitures le week-end. Certains commerçants s'inquiètent, mais je pense que cette idée mérite notre soutien.\n\nDe plus, des rues plus calmes rendraient le centre plus agréable pour les familles, qui l'évitent souvent aujourd'hui à cause du bruit et de la circulation." },
    B: { model: 'Mistral', judgeLevel: 2, judgeDir: 'Too hard', estLevel: 'C1', estReg: 'formal', chips: [['436 words', 0], ['21.4 / sentence', 0], ['5 paragraphs', 1], ['2 connectors', 1]],
      text: "Résidant dans notre commune depuis deux décennies, j'ai observé l'inexorable croissance du trafic dans le centre historique. Contrairement aux appréhensions exprimées par certains commerçants, la piétonnisation ne précipiterait nullement le déclin du commerce local." }
  }
};
const THEMES = ['Environnement', 'Logement', 'Travail', 'Santé', 'Voyages', 'Éducation', 'Culture', 'Technologies'];
const TYPES = ["Texte d'opinion", 'Courriel personnel', 'Article', 'Témoignage', 'Récit', 'Compte rendu', 'Lettre formelle'];
const BRIEFS = [['Environnement', "Texte d'opinion", 'Un habitant écrit au journal local pour défendre un centre-ville sans voitures.'], ['Logement', 'Courriel personnel', 'Une étudiante écrit à une amie pour raconter son emménagement en colocation.'], ['Travail', 'Témoignage', 'Un employé raconte à un magazine sa première semaine dans un nouveau poste.']];
const ERRORS = ['Vocabulary too hard', 'Structure too complex', 'Information lost', 'Addition', 'Misinterpretation', 'Unnatural text', 'Coherence break', 'Presented as real (generation)'];
const REGISTERS = ['Informal', 'Neutral', 'Formal', 'Literary'];
const JUDGE = 'Claude';
const PAIRS = [['Mistral', 'Qwen'], ['GPT', 'Mistral'], ['GPT', 'Qwen']];

let S;
function newTask(key) {
  S.seq += 1;
  const t = JSON.parse(JSON.stringify(SAMPLE[key]));
  return Object.assign(t, { id: S.seq, created: new Date().toISOString(), simulated: true,
    ev: { r: {}, reg: {}, err: { A: [], B: [] }, best: null, why: '' }, ag: {}, your: '', sent: { A: false, B: false }, status: 'to-evaluate' });
}
const DEFAULT_MODELS = [
  { role: 'Generator', model: 'Mistral', providerType: 'openrouter', modelId: '' },
  { role: 'Generator', model: 'GPT', providerType: 'openrouter', modelId: '' },
  { role: 'Generator', model: 'Qwen', providerType: 'openrouter', modelId: '' },
  { role: 'Judge', model: 'Claude', providerType: 'openrouter', modelId: '' }];
function fixSettings(st) {
  st.models = (st.models || JSON.parse(JSON.stringify(DEFAULT_MODELS))).filter(m => m.role !== 'Reserve').map((m, i) => Object.assign({}, DEFAULT_MODELS[i] || {}, { role: m.role, model: m.model, providerType: m.providerType || (DEFAULT_MODELS[i] || {}).providerType || 'openrouter', modelId: m.modelId || m.version || '', priceIn: m.priceIn || '', priceOut: m.priceOut || '', priceAuto: !!m.priceAuto }));
  if (typeof st.temperature !== 'number') st.temperature = 0.7;
  if (!st.role) st.role = 'admin';
  if (!st.batchSeq) st.batchSeq = 0;
  if (!st.installId) st.installId = Math.random().toString(36).slice(2, 8);
  return st;
}
function uiDefaults() {
  return { view: 'home', current: null, homeTab: 'all', newMode: null, toast: '', err: '', yourErr: '', formErr: '', animate: false, confirmWipe: false, confirmDel: null, judging: {}, judgeErr: {},
    file: null, theme: BRIEFS[0][0], themeOther: '', type: BRIEFS[0][1], typeOther: '', situation: BRIEFS[0][2], brief: 0, level: null, srcLevel: 'C1', srcLevelSource: 'given', estimating: false, estimate: null, pair: 'Auto', busy: false, testMsg: {} };
}
function seedDemo() {
  S.seq = 10; S.tasks = [];
  const d1 = newTask('FR-Generate'); d1.status = 'done'; d1.ev.best = 'A';
  const d2 = newTask('FR-Adapt'); d2.status = 'adapting'; d2.ev.best = 'B';
  const p1 = newTask('FR-Adapt'); const p2 = newTask('FR-Generate');
  S.tasks = [d1, d2, p1, p2];
}
function init() {
  S = Object.assign(uiDefaults(), { seq: 10, tasks: [], settings: { language: 'French', annotator: '', models: JSON.parse(JSON.stringify(DEFAULT_MODELS)) }, keys: loadKeys() });
  seedDemo(); render();
}

/* ---------- Storage: IndexedDB, falls back to localStorage, then memory ---------- */
const APP_ID = 'Adapt-CEFR', APP_IDS = ['Adapt-CEFR', 'CEFR-ObTIC']; /* files from the former name stay readable */
const DB_NAME = 'cefr-obtic', STORE = 'kv', SCHEMA = 1, LS_STATE = 'cefr-obtic-state', LS_KEYS = 'cefr-obtic-keys';
let STORAGE = 'indexeddb', dbHandle = null;
function openDb() {
  return new Promise((res, rej) => {
    if (!window.indexedDB) return rej(new Error('IndexedDB unavailable'));
    const r = indexedDB.open(DB_NAME, 1);
    r.onupgradeneeded = () => r.result.createObjectStore(STORE);
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
}
function dbReq(mode, fn) {
  return new Promise((res, rej) => { const tx = dbHandle.transaction(STORE, mode); const q = fn(tx.objectStore(STORE)); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); });
}
function snapshot() { return { schema: SCHEMA, app: APP_ID, savedAt: new Date().toISOString(), seq: S.seq, settings: S.settings, tasks: S.tasks }; }
async function loadData() {
  try { dbHandle = await openDb(); const d = await dbReq('readonly', st => st.get('state')); return d || null; }
  catch (e) {
    try { STORAGE = 'local'; const raw = localStorage.getItem(LS_STATE); return raw ? JSON.parse(raw) : null; }
    catch (e2) { STORAGE = 'memory'; return null; }
  }
}
async function persist() {
  const data = snapshot();
  try {
    if (STORAGE === 'indexeddb') await dbReq('readwrite', st => st.put(data, 'state'));
    else if (STORAGE === 'local') localStorage.setItem(LS_STATE, JSON.stringify(data));
  } catch (e) { STORAGE = STORAGE === 'indexeddb' ? 'local' : 'memory'; if (STORAGE === 'local') persist(); renderNav(); }
}
let saveTimer = null;
function save() { clearTimeout(saveTimer); saveTimer = setTimeout(persist, 200); }
function loadKeys() { try { return JSON.parse(localStorage.getItem(LS_KEYS) || '{}'); } catch (e) { return {}; } }
function saveKeys() { if (!S.keysSaved) return; try { localStorage.setItem(LS_KEYS, JSON.stringify(S.keys)); } catch (e) { /* keys stay in memory only */ } }
function keysStored() { try { return !!localStorage.getItem(LS_KEYS); } catch (e) { return false; } }
function applyData(d) {
  S.seq = d.seq || 0; S.tasks = Array.isArray(d.tasks) ? d.tasks : [];
  S.settings = fixSettings(Object.assign({ language: 'French', annotator: '', models: JSON.parse(JSON.stringify(DEFAULT_MODELS)) }, d.settings || {}));
}
async function boot() {
  S = Object.assign(uiDefaults(), { seq: 0, tasks: [], settings: fixSettings({ language: 'French', annotator: '', models: JSON.parse(JSON.stringify(DEFAULT_MODELS)) }), keys: loadKeys(), keysSaved: keysStored() });
  const d = await loadData();
  if (d && d.schema) { applyData(d); if (S.settings.roleChosen === undefined) S.settings.roleChosen = true; } /* existing installations keep their role */
  else S.settings.roleChosen = false;
  if (!S.settings.demoRemoved) { S.tasks = S.tasks.filter(t => !(t.simulated && t.id >= 11 && t.id <= 14)); S.settings.demoRemoved = true; } /* drop the four demo tasks of earlier versions, once */
  render();
}
function download(name, text, type) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
const stamp = () => new Date().toISOString().slice(0, 16).replace(/[:T]/g, '-');
function wordDistance(a, b) {
  const x = a.trim().split(/\s+/).filter(Boolean), y = b.trim().split(/\s+/).filter(Boolean);
  let prev = Array.from({ length: y.length + 1 }, (_, j) => j);
  for (let i = 1; i <= x.length; i++) { const cur2 = [i]; for (let j = 1; j <= y.length; j++) cur2[j] = Math.min(prev[j] + 1, cur2[j - 1] + 1, prev[j - 1] + (x[i - 1] === y[j - 1] ? 0 : 1)); prev = cur2; }
  return prev[y.length];
}
function finalRecords(t) {
  const own = t.status === 'done' ? [{ annotator: S.settings.annotator || null, ev: t.ev, your: t.your, finalSide: t.finalSide || null, dist: t.dist, sent: t.sent, validatedAt: t.validatedAt }] : [];
  return own.concat(Object.entries(t.annotations || {}).filter(([, a]) => a.status === 'done').map(([n, a]) => Object.assign({ annotator: n }, a)));
}
function corpusJsonl() {
  return S.tasks.flatMap(t => finalRecords(t).map(a => ({ t, a }))).map(({ t, a }) => JSON.stringify({
    task_id: t.id, task_uid: t.uid || null, batch: t.batch || null, language: S.settings.language, mode: t.mode === 'Adapt' ? 'adapt' : 'generate',
    origin: t.mode === 'Adapt' ? 'authentic_adaptation' : 'synthetic',
    source_level: t.srcLevel === 'Unknown' ? null : t.srcLevel || null, source_level_source: t.srcLevelSource || (t.srcLevel ? 'given' : null), source_level_estimate: t.srcEstimate ? { level: t.srcEstimate.level, reason: t.srcEstimate.reason, model: t.srcEstimate.model, prompt_version: t.srcEstimate.promptVersion || null, profile_version: t.srcEstimate.profileVersion || null, prompt: t.srcEstimate.prompt || null } : null, target_level: t.level, direction: t.dir,
    source_or_brief: t.src, source_file: t.sourceFile || null,
    final_text: a.your, versions: { A: { model: t.A.model, model_id: t.A.modelId || null, text: t.A.text, log: t.A.log ? Object.assign({}, t.A.log, { raw: undefined }) : null }, B: { model: t.B.model, model_id: t.B.modelId || null, text: t.B.text, log: t.B.log ? Object.assign({}, t.B.log, { raw: undefined }) : null } },
    prompt: t.prompt || null, prompt_version: t.promptVersion || null, profile_version: t.profileVersion || null,
    evaluation: { annotator: a.annotator, ratings: a.ev.r, best: a.ev.best, best_overridden: !!a.ev.bestManual, blind: a.ev.blind !== false, why: a.ev.why || null, validated_at: a.ev.validatedAt || null },
    judge: t.judge ? { model: t.judge.model, version: t.judge.version, A: t.judge.A, B: t.judge.B, best: t.judge.best, consistent: t.judge.consistent, reasons: t.judge.runs.map(r => r.order + ': ' + r.reason) } : t.judgePick ? { model: JUDGE, simulated: true, A: { level: t.A.judgeLevel, dir: t.A.judgeDir }, B: { level: t.B.judgeLevel, dir: t.B.judgeDir }, best: t.judgePick } : null,
    costs_usd: (c => ({ total: c.total.usd, total_kind: c.total.kind, generation_A: c.A ? c.A.usd : null, generation_B: c.B ? c.B.usd : null, judge: c.judge.usd, source_level_estimate: c.estimate ? c.estimate.usd : null }))(taskCosts(t)),
    judge_final: (() => { const f = t.judge && t.judge.finals && t.judge.finals[a.annotator || 'administrator']; return f && f.text === a.your ? { level: f.level, dir: f.dir, meaning_or_brief: f.crit2, grammar: f.grammar, reason: f.reason, model: f.model, version: f.version } : null; })(),
    final_from: a.finalSide || null, edit_distance_words: a.dist || null, created: t.created || null, validated_at: a.validatedAt || null,
    simulated_generation: !!t.simulated })).join('\n') + '\n';
}

/* ========== Step 2: level profiles, prompts and model calls ========== */
const PROFILES = {
  A1: { words: [100, 120], avg: 7, paras: [2, 3], vocab: { French: 'environ 1 000 mots courants', English: 'about 1,000 common words' },

}

/* ---------- Home ---------- */
function viewHome() {

  <div class="card scroll" style="padding:0"><table style="min-width:900px;table-layout:fixed"><colgroup><col style="width:22%"><col style="width:14%"><col style="width:11%"><col style="width:9%"><col style="width:7%"><col style="width:7%"><col style="width:12%"><col style="width:18%"></colgroup><thead><tr><th>Document</th><th>Mode</th><th>Level</th><th>Language</th><th>Batch</th><th>Choice</th><th>Status</th><th><span style="position:absolute;left:-9999px">Action</span></th></tr></thead><tbody>

    <td><span class="${label[t.status][1]}">${label[t.status][0]}</span></td>
    <td style="text-align:right">${t.status === 'to-evaluate' ? `<button class="btn outline" style="height:36px" data-eval="${t.id}">Evaluate</button>` : t.status === 'adapting' ? `<button class="btn outline" style="height:36px" data-resume="${t.id}">Resume adapting</button>` : ''}</td></tr>`; }).join('') || `<tr><td colspan="8" class="muted">No task here.</td></tr>`}
  </tbody></table></div>`;
}

/* ---------- 1 Corpus ---------- */

    <div class="row"><label class="btn" for="batchIn" style="display:inline-flex;align-items:center;cursor:pointer">Import a batch</label><input type="file" id="batchIn" accept=".json,application/json" style="position:absolute;left:-9999px">
      <button class="btn" data-exportres="1">Export my results</button></div></div>
    <p class="muted" style="margin:0;font-size:13px">${got.length ? 'Batches received: ' + got.join(', ') + '. ' : ''}Import the batch file sent by the administrator, evaluate and adapt each text, then export your results and send the file back.</p>
    ${processedList()}`;
  }

}
function processedList() {

  <div class="card scroll" style="padding:0"><table style="min-width:900px;table-layout:fixed"><colgroup><col style="width:8%"><col style="width:9%"><col style="width:10%"><col style="width:8%"><col style="width:30%"><col style="width:13%"><col style="width:14%"><col style="width:8%"></colgroup><thead><tr><th>Task</th><th>Mode</th><th>Level</th><th>Choice</th><th>Final version</th><th>Status</th><th><span style="position:absolute;left:-9999px">Action</span></th><th><span style="position:absolute;left:-9999px">Delete</span></th></tr></thead><tbody>
  ${done.map(t => `<tr><td title="${isAdmin() && !t.simulated ? (c => `Cost: ${fmtUsd(c.total.usd)} (${c.total.kind}${c.total.missing ? ', ' + c.total.missing + ' call(s) without price' : ''}) · A ${fmtUsd(c.A && c.A.usd)} · B ${fmtUsd(c.B && c.B.usd)} · judge ${fmtUsd(c.judge.usd)}${c.estimate ? ' · estimate ' + fmtUsd(c.estimate.usd) : ''}`)(taskCosts(t)) : ''}">Task ${t.id}${t.batch ? ` <span class="chip">${t.batch}</span>` : ''}</td><td>${t.mode}</td><td>${t.mode === 'Adapt' ? srcTxt(t) + ' → ' + t.level : t.level}</td><td>${t.ev.best || '—'}</td>
    <td>${t.status === 'done' ? esc((t.your || t[t.ev.best === 'B' ? 'B' : 'A'].text).slice(0, 70)) + '…' : '<span class="muted">not written yet</span>'}</td>
    <td><span class="${label[t.status][1]}">${label[t.status][0]}</span></td>
    <td style="text-align:right">${t.status === 'adapting' ? `<button class="btn outline" style="height:36px" data-resume="${t.id}">Resume adapting</button>` : t.status === 'to-evaluate' ? `<button class="btn outline" style="height:36px" data-eval="${t.id}">Evaluate</button>` : ''}</td>
    <td style="text-align:center">${S.confirmDel === t.id ? `<button class="btn" style="height:32px;padding:0 8px;color:#b42318;border-color:#b42318" data-del="${t.id}" title="Click again to delete">Delete?</button>` : `<button class="small" data-del="${t.id}" title="Delete this text" aria-label="Delete task ${t.id}" style="font-size:16px;line-height:1">×</button>`}</td></tr>`).join('') || '<tr><td colspan="8" class="muted">No text processed yet.</td></tr>'}
  </tbody></table></div>`;
}
function selectWithOther(id, list, value, other, label) {

}
function newForm() {
  const common = `<div class="grid2">
      <div class="f">Target level<div class="row" style="gap:6px" role="group" aria-label="Target level">${LEVELS.map(l => `<button class="opt ${S.level === l ? 'on' : ''}" aria-pressed="${S.level === l}" data-lvl="${l}">${l}</button>`).join('')}</div></div>
      <label class="f"><span>Model pair <span class="muted">· Auto keeps the pairs and the A/B positions balanced.</span></span><select id="pairSel"><option value="Auto" ${S.pair === 'Auto' ? 'selected' : ''}>Auto (next in rotation)</option>${(() => { const g = readyGenerators(), o = []; for (let i = 0; i < g.length; i++) for (let j = i + 1; j < g.length; j++) o.push(genName(g[i]) + ' vs ' + genName(g[j])); return o.map(x => `<option ${S.pair === x ? 'selected' : ''}>${x}</option>`).join(''); })()}</select>${readyGenerators().length < 2 ? '<span class="muted">No model is set up yet: add model IDs and API keys in Settings.</span>' : ''}</label></div>`;

    ${S.file ? `<div style="max-height:260px;overflow:auto;padding:10px;border:1px solid var(--line);border-radius:8px;font-size:13px;line-height:1.6;white-space:pre-line">${esc(S.file.text)}</div>
    <div class="f">Source level<div class="row" style="gap:6px" role="group" aria-label="Source level">${LEVELS.map(l => `<button class="opt ${S.srcLevel === l ? 'on' : ''}" aria-pressed="${S.srcLevel === l}" data-srclvl="${l}">${l}</button>`).join('')}
      <button class="opt ${S.srcLevel === 'Unknown' || S.srcLevelSource === 'estimated' ? 'on' : ''}" style="margin-left:8px" data-estimate="1" ${S.estimating ? 'disabled' : ''} title="${judgeReady() ? 'The LLM judge estimates the level; you can correct it' : 'No Judge model in Settings: the level is recorded as unknown'}">${S.estimating ? 'Estimating…' : 'Unknown? Estimate with the LLM'}</button>
      ${S.estimate ? (S.estimate.error ? `<span class="err" title="${esc(S.estimate.error)}">Estimate failed: level recorded as unknown</span>` : `<span class="muted" title="${esc(S.estimate.reason || '')}">Estimated by the LLM (${esc(S.estimate.model)}): <b>${S.estimate.level}</b></span>`) : S.srcLevel === 'Unknown' ? '<span class="muted">No Judge model: level recorded as unknown</span>' : ''}</div>
      <div style="height:36px;margin-top:6px;display:flex;align-items:center;gap:6px;overflow:hidden;white-space:nowrap"><span class="chip">Direction: ${formDirection() || 'choose a target level'}</span>${formDirection() === 'adaptation' ? `<span class="muted">${S.srcLevel === 'Unknown' ? 'source level unknown' : `source and target are both ${S.level}`}: the models simplify or enrich as needed</span>` : ''}</div></div>` : ''}

}

/* ---------- 2 Evaluate ---------- */
function ratingBlock(t, v, locked) {
  const r = t.ev.r, crits = [['1', '<b style="color:var(--ink)">Level</b> · fit with the target level · 1 poor · 5 excellent'], ['2', `<b style="color:var(--ink)">${t.crit2}</b> · ${t.crit2Hint} · 1 poor · 5 excellent`], ['3', '<b style="color:var(--ink)">Grammar and naturalness</b> · 1 poor · 5 excellent']];
  const opts = (key, values) => values.map(x => `<button class="opt ${r[key] === x ? 'on' : ''}" aria-pressed="${r[key] === x}" data-rate="${key}" data-val="${x}" ${locked ? 'disabled' : ''}>${x}</button>`).join('');
  const lv = r[v + '1'], dirOff = locked || lv === undefined || lv === 5;
  const radio = x => `<label style="display:inline-flex;align-items:center;gap:6px;font-size:13px;color:${dirOff ? '#9B9890' : 'var(--ink2)'};cursor:${dirOff ? 'default' : 'pointer'}"><input type="radio" name="dir${v}" value="${x}" data-dirv="${v}" ${r[v + 'd'] === x ? 'checked' : ''} ${dirOff ? 'disabled' : ''}> ${x}</label>`;
  const levelRow = `<div class="row" style="gap:4px">${opts(v + '1', [1, 2, 3, 4, 5])}
    <span role="radiogroup" aria-label="Direction of the gap for version ${v}" class="row" style="gap:14px;margin-left:14px">${radio('Too easy')}${radio('Too hard')}<span class="muted">${lv === undefined ? 'after the level score' : lv === 5 ? 'on target' : r[v + 'd'] ? '' : 'required'}</span></span></div>`;
  return crits.map(c => `<div class="crit" ${c[0] === '1' ? 'style="padding-top:12px;margin-top:4px;border-top:1px solid var(--line)"' : ''}><span class="muted">${c[1]}</span>${c[0] === '1' ? levelRow : `<div class="row" style="gap:4px">${opts(v + c[0], [1, 2, 3, 4, 5])}</div>`}</div>`).join('');
}
function viewEvaluate() {
  let t = cur();
  if (!t || (t.status !== 'to-evaluate' && t.status !== 'adapting')) { t = pending()[0]; if (t) S.current = t.id; }
  const locked = t && t.status === 'adapting';
  if (!t) return `<div class="card empty"><h2>No task to evaluate</h2><p>Load or generate a text in Corpus.</p><button class="btn primary" data-go="corpus">Go to Corpus</button></div>`;
  const col = v => `<section class="card ver" aria-label="Version ${v}">
      <div class="row between"><h2>Version ${v}</h2><span class="muted">${isAdmin() && t[v].model ? esc(t[v].model) : 'Model hidden'}</span></div>
      <div class="txt">${esc(t[v].text)}</div><div class="row" style="gap:4px">${chipsHtml(t[v].chips)}</div>${ratingBlock(t, v, locked)}</section>`;
  const bests = [['A', 'A'], ['Equal', 'Equal'], ['B', 'B']];
  const allRated = isComplete(t);
  return `${taskChips(t)}
  <div class="cols three">${col('A')}${sourceCol(t)}${col('B')}</div>
  <div class="card" style="display:flex;flex-direction:column;gap:10px">
    <div class="row"><span class="muted" style="font-size:13px">Better version</span>${bests.map(b => `<button class="opt ${t.ev.best === b[0] ? 'on' : ''}" aria-pressed="${t.ev.best === b[0]}" data-best="${b[0]}" ${locked || !allRated ? 'disabled' : ''}>${b[1]}</button>`).join('')}
      <label class="f" style="flex:1 1 280px;flex-direction:row;align-items:center;gap:8px">Why (optional)<input type="text" id="why" value="${esc(t.ev.why)}" ${locked ? 'readonly' : ''} placeholder="Closer to the target level, meaning complete" style="flex:1;min-width:0"></label></div>
    <div class="row between"><span class="${S.err ? 'err' : 'muted'}">${S.err ? esc(S.err) : locked ? 'Evaluation validated: your choices are kept and can no longer be changed.' : (t.ev.best && !t.ev.bestManual ? 'Better version pre-selected from your ratings; change it if needed.' : !allRated ? 'Rate all criteria for A and B: the better version is then selected automatically, and you can change it.' : isAdmin() && t.A.model ? 'Administrator: model names are shown; your evaluation is recorded as not blind.' : 'The LLM judge is shown in Adapt, after you validate.')}</span>
      ${locked ? '<button class="btn primary" data-go="adapt">Continue in Adapt</button>' : '<button class="btn primary" data-validate-eval="1">Validate evaluation</button>'}</div></div>`;
}

/* ---------- 3 Adapt ---------- */
function viewAdapt() {
  const t = cur();
  if (!t || t.status !== 'adapting') return `<div class="card empty"><h2>Nothing to adapt yet</h2><p>Validate an evaluation first, or resume a task marked To adapt in Home or Corpus.</p><button class="btn primary" data-go="evaluate">Go to Evaluate</button></div>`;
  const ink = x => `<b style="color:var(--ink)">${x}</b>`;
  const match = same => `<span class="chip ${same ? 'ok' : 'warn'}">${same ? 'Same' : 'Different'}</span>`;
  const cell = (html, mid) => `<div class="card" style="font-size:13px;color:var(--muted);min-width:0;padding:12px 16px;${mid ? 'border-color:var(--accent);' : ''}">${html}</div>`;
  const bestTxt = { A: 'A', B: 'B', Equal: 'Equal' }[t.ev.best];
  const jName = t.judge ? t.judge.family : t.simulated ? JUDGE : (judgeModel() && judgeModel().modelId ? familyOf(judgeModel()) : 'LLM');
  const jNone = !isAdmin() ? '<span class="muted">kept by the administrator</span>' : S.judging[t.id] ? '<span class="muted">running…</span>'
    : S.judgeErr[t.id] ? `<span class="err" title="${esc(S.judgeErr[t.id])}">failed</span> <button class="small" data-runjudge="1">Retry</button>`
    : !judgeReady() ? '<span class="muted">no judge model in Settings</span>' : '<span class="muted">not available</span> <button class="small" data-runjudge="1">Run</button>';
  const jl = v => t[v].judgeLevel ? ink(t[v].judgeLevel + ', ' + t[v].judgeDir.toLowerCase()) : jNone;
  const lvlCell = v => cell(`<span>Level of ${v} · you: ${ink(t.ev.r[v + '1'] + ', ' + t.ev.r[v + 'd'].toLowerCase())} · LLM judge (${esc(jName)}): ${jl(v)}</span>`);
  const band = `<div class="cols three" aria-label="Your choices and the LLM judge's">
    ${lvlCell('A')}
    ${cell(`<span>Better version · you: ${ink(bestTxt)} · LLM judge (${esc(jName)}): ${t.judgePick ? ink(t.judgePick) + (t.judge && !t.judge.consistent ? ' <span class="muted" title="The two readings, in A/B and B/A order, disagreed">(order-dependent)</span>' : '') : jNone}</span>`, true)}
    ${lvlCell('B')}</div>`;
  ensureEdits(t);
  const col = v => { const changed = t.edit[v] !== t[v].text, fin = t.finalSide === v;
    return `<section class="card ver" aria-label="Version ${v}" style="${fin ? 'border:2px solid var(--accent);padding:15px' : ''}">
      <div class="row between" style="height:32px"><span class="row" style="gap:8px"><h2>Version ${v}</h2><span class="muted">${t[v].model || ''}</span></span>
        <span class="row" style="gap:6px"><button class="small" data-restore="${v}" ${changed ? '' : 'disabled'} title="Back to the generated text">Restore original</button>
        <button class="opt ${fin ? 'on' : ''}" aria-pressed="${fin}" data-final="${v}" title="${fin ? 'This version goes to the corpus' : 'Use this version as the final one'}">${fin ? 'Final' : 'Use as final'}</button></span></div>
      <label for="edit${v}" style="position:absolute;left:-9999px">Version ${v}, editable</label>
      <textarea id="edit${v}" class="body edit" data-edit="${v}">${esc(t.edit[v])}</textarea>
      <div class="row" style="gap:4px;min-height:56px;align-content:flex-start" id="chips${v}">${liveChips(t, t.edit[v])}</div></section>`; };
  return `${taskChips(t)}
  <div class="cols three" id="adaptCols">${col('A')}${sourceCol(t, true)}${col('B')}</div>
  ${band}
  <div style="display:flex;flex-direction:column;align-items:center;gap:6px;padding-top:6px">
    ${S.yourErr ? `<span class="err">${esc(S.yourErr)}</span>` : ''}
    <button class="btn primary" data-corpus="1" style="height:44px;min-width:260px">${t.finalSide ? `Validate version ${t.finalSide} for corpus` : 'Choose the final version'}</button></div>`;
}

/* ---------- Admin views ---------- */

/* ---------- Guide ---------- */
function viewGuide() {
  const sec = (title, body) => `<section class="card" style="display:flex;flex-direction:column;gap:8px;font-size:13px;line-height:1.6"><h2>${title}</h2>${body}</section>`;
  const tbl = (head, rows, widths) => `<table style="width:100%;table-layout:fixed">${widths ? `<colgroup>${widths.map(w => `<col style="width:${w}">`).join('')}</colgroup>` : ''}<thead><tr>${head.map(h => `<th style="white-space:normal">${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r => `<tr>${r.map(c => `<td style="vertical-align:top;white-space:normal;overflow:visible">${c}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
  return `<h1>Guide</h1>
  <p class="muted" style="margin:0;font-size:13px">Everything an annotator needs, from the project specification. Texts are for reading comprehension: texts only, no questions.</p>
  ${sec('How a task works', `<ul style="margin:0;padding-left:20px">
    <li><b>Home</b> shows where you stand (validated texts, texts to evaluate, texts to adapt; click a card to filter) and lists every task: document (file name, or Generated), mode (simplification, complexification, adaptation or generation), source and target levels, language, batch, better version and status.</li>
    <li><b>Corpus</b>: load a text from your computer (adaptation) or fill in a brief (generation); the texts already processed are listed below. Two models, drawn in rotation, each write one version with the same prompt. If you do not know the source level, click <b>Unknown? Estimate with the LLM</b>: the judge proposes a level, which you can correct, and the direction follows. The direction is <b>simplification</b> or <b>complexification</b>, or <b>adaptation</b> when the source level is unknown or equal to the target: the models then simplify or enrich as needed, to fit the level profile. The export records whether the level was given, estimated or unknown.</li>
    <li><b>Evaluate</b>: the source text (or the brief) is in the middle, read only, between versions A and B. Rate A and B without knowing the models (level, meaning or brief, grammar and naturalness; the administrator sees the model names, and his evaluations are recorded as not blind), then choose the better one (A, Equal or B); the reason is optional. Counts under each text (words, sentence length, paragraphs, connectors) are computed automatically.</li>
    <li><b>Adapt</b>: the LLM judge's ratings appear, and the model names for the administrator (annotators never see them). Versions A and B become editable, with the source text in the middle. The version you chose as better is marked <b>Final</b>; edit it directly, copy and paste between A and B as you like, or click <b>Use as final</b> on the other one. <b>Restore original</b> brings back the generated text; the generated versions are always kept for the analysis. Then <b>Validate version A (or B) for corpus</b>: this step is required to finish the task. If you leave Adapt before validating, the task waits in Home as To adapt.</li><li><b>Analysis</b> (administrator only): model duels, level reached, human contribution, agreement, SARI and costs, with a CSV of all evaluations, and the <b>Export corpus (JSONL)</b> button for the final silver corpus. Costs are the amounts charged by OpenRouter, or tokens × the prices entered in Settings for the direct APIs. <b>Settings</b>: installation, level profiles, and data (backup, restore); for the administrator, also the LLMs (provider, model ID, key, prices per million tokens, filled on Test for OpenRouter, and a connection test), the generation temperature, keys and prompt. <b>Guide</b>: this page.</li></ul>`)}
  ${sec('Roles and batches', `<ul style="margin:0;padding-left:20px"><li><b>Administrator</b>: sets up the models, generates the texts in Corpus, groups them into a <b>batch</b> and sends the batch file to the annotators. Imports their results files, sees the agreement between annotators, and exports the corpus with every annotator's versions.</li><li><b>Annotator</b>: no model or key needed. In Corpus, imports the batch file, evaluates and adapts each text as usual, then clicks <b>Export my results</b> and sends the file to the administrator. Model names stay hidden.</li><li>The role is chosen at first launch, shown in the header, and can be changed in Settings. To measure agreement, at least two annotators must receive the same batch.</li></ul>`)}
  ${sec('Before you rate', `<ul style="margin:0;padding-left:20px"><li>Read the source text or the brief, then the target level in Settings → Level profiles.</li><li>Read both versions in full before rating.</li><li>Rate each version on its own, against the target level, not against the other version. Both can get the same score.</li><li>Do not look for the model names: they stay hidden during the evaluation.</li></ul>`)}
  ${sec('Rating scales (1 to 5, 5 = best)', tbl(['Score', 'Level', 'Meaning (adaptation) / brief (generation)', 'Grammar and naturalness'], [
    ['5', 'Fully at the target level; a learner of that level understands without help.', 'All key information, no forbidden addition, no misinterpretation. Brief: theme, type and situation all respected.', 'No errors; natural for a native speaker.'],
    ['4', 'At the level, with 1 or 2 isolated items above or below it.', 'Minor loss of secondary information. Brief: one secondary element approximate.', '1 or 2 awkward phrasings, no errors.'],
    ['3', 'Partly at the level: several items off, or passages clearly too simple.', 'One key piece of information lost or one forbidden addition. Brief: one main element poorly respected.', 'Some errors or artificial phrasing; reading not hindered.'],
    ['2', 'Rather the neighbouring level (one level off).', 'Several losses or additions, or a partial misinterpretation. Brief: two main elements missed.', 'Frequent errors or clearly artificial text.'],
    ['1', 'Clearly another level (two levels or more off).', 'Overall meaning altered or major misinterpretation. Brief: off topic.', 'Errors that hinder understanding.']], ['8%', '31%', '35%', '26%']) +
    `<p style="margin:0">Under the level score, when it is below 5, tick <b>Too easy</b> or <b>Too hard</b>. A level of 5 means the text is on target.</p>` +
    `<p style="margin:0"><b>Not penalised</b>: in simplification, leaving out secondary information to meet the length; in complexification, the additions allowed below; the simplicity of a low-level text, under language quality.</p>`)}
  ${sec('Length and enrichment', `<p style="margin:0">The target length is the level's, whatever the source length. Simplifying a long text means <b>keeping the essentials</b> and never contradicting the source. Complexifying a short text means <b>developing</b> it.</p>` +
    tbl(['Allowed when enriching', 'Not allowed'], [['Definitions, explanations, rephrasing of source content', 'Proper names absent from the source'], ['Generic examples; connectors, transitions, introduction, conclusion', 'New figures, dates, quotes or events'], ['General, non-verifiable perspective', 'Causes or consequences the source does not state']]))}
  ${sec('Choosing and writing your version', `<ul style="margin:0;padding-left:20px"><li><b>Better version</b>: the one closest to a usable reading text at the target level. It is pre-selected from your ratings (the higher level score wins; if equal, meaning or brief, then grammar); change it if your overall judgment differs. Choose <b>Equal</b> only if neither is better. The reason is optional but helpful.</li><li><b>Final version</b>: make the <b>smallest changes</b> needed to reach the level (counts in green) and fix errors. Do not rewrite for taste; keep the source's facts. If you rewrite more than half of the text, say so in the reason.</li><li><b>Your choices and the LLM judge's</b>: for the administrator, the band under the columns shows your level scores and your better version next to those of the LLM judge. The judge rates A and B twice, in both orders, and the averages are shown; "order-dependent" means its two readings disagreed. It also rates each validated final version, without knowing who wrote it. Annotators do not see the judge: the comparison is made by the administrator. Nothing to answer.</li></ul>`)}
  ${sec('Target levels', `<p style="margin:0">The target values of each level (length, sentences, paragraphs, vocabulary, grammar, connectors, register, what to avoid) are in <b>Settings → Level profiles</b>.</p>`)}`;
}

const DIRS = ['Too easy', 'On target', 'Too hard'];
function isComplete(t) {
  const r = t.ev.r;
  return ['A', 'B'].every(v => [1, 2, 3].every(i => r[v + i] !== undefined) && r[v + 'd']);
}
/* Better version pre-selected from the ratings: level first (closest to 3), then meaning or brief fit, then language. Editable. */
function autoBest(t) {
  const r = t.ev.r, keys = ['A1', 'A2', 'A3', 'B1', 'B2', 'B3'];
  if (t.ev.bestManual) return;
  if (!isComplete(t)) { t.ev.best = null; return; }
  const score = v => [r[v + '1'], r[v + '2'], r[v + '3']];
  const a = score('A'), b = score('B');
  for (let i = 0; i < 3; i++) { if (a[i] > b[i]) { t.ev.best = 'A'; return; } if (b[i] > a[i]) { t.ev.best = 'B'; return; } }
  t.ev.best = 'Equal';
}

/* ---------- Render ---------- */
function render() {
  renderNav();
  const v = { home: viewHome, corpus: viewCorpus, evaluate: viewEvaluate, adapt: viewAdapt, settings: viewSettings, guide: viewGuide, analysis: isAdmin() ? viewAnalysis : viewHome }[S.view];
  $('view').innerHTML = `<div style="display:flex;flex-direction:column;gap:14px">${S.settings.roleChosen ? v() : viewWelcome()}</div>`;
  if (S.view === 'adapt' && S.animate) { S.animate = false; requestAnimationFrame(() => requestAnimationFrame(() => { const c = $('cols'); if (c) c.classList.add('open'); })); }
  save();
}
function nextAfter(msg) {
  S.toast = msg; S.current = null;
  const n = pending()[0];
  if (n) { S.current = n.id; go('evaluate'); } else go('home');
}

/* ---------- Events ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('button'); if (!el) return;
  const d = el.dataset, t = cur();
  if (el.id === 'brand') { Object.assign(S, uiDefaults()); render(); window.scrollTo(0, 0); return; }
  if (d.pickrole) { S.settings.role = d.pickrole; S.err = ''; render(); return; }
  if (d.start) {
    if (!S.settings.annotator.trim()) { S.err = 'Enter a pseudonym first.'; render(); return; }
    S.settings.roleChosen = true; go(isAdmin() ? 'home' : 'corpus'); persist(); return;
  }
  if (d.go) { go(d.go, { toast: '' }); return; }
  if (d.new !== undefined) { S.newMode = d.new || null; S.level = null; S.fileErr = ''; S.toast = ''; S.formErr = ''; render(); return; }
  if (d.brief) { S.brief = (S.brief + 1) % BRIEFS.length; const b = BRIEFS[S.brief]; S.theme = b[0]; S.type = b[1]; S.situation = b[2]; S.formErr = ''; render(); return; }
  if (d.create) {
    if (S.busy) return;
    if (d.create === 'FR-Adapt' && !S.file) { S.fileErr = 'Choose a text file first.'; render(); return; }
    if (!S.level) { S.formErr = 'Choose a target level first.'; render(); return; }
    if (d.create === 'FR-Generate' && ((S.theme === '__other' && !S.themeOther.trim()) || (S.type === '__other' && !S.typeOther.trim()) || !S.situation.trim())) { S.formErr = 'Fill in the theme, the text type and the situation first.'; render(); return; }
    const th = S.theme === '__other' ? S.themeOther.trim() : S.theme, ty = S.type === '__other' ? S.typeOther.trim() : S.type;
    const spec = d.create === 'FR-Adapt'
      ? { mode: 'Adapt', level: S.level, srcLevel: S.srcLevel, srcLevelSource: S.srcLevelSource, srcEstimate: S.estimate && !S.estimate.error ? S.estimate : null, direction: formDirection(), source: S.file.text, fileName: S.file.name, label: `Source text · ${S.file.name} · ${S.file.words} words` }
      : { mode: 'Generate', level: S.level, brief: { theme: th, type: ty, situation: S.situation.trim() }, label: `Brief · ${th} · ${ty}` };
    if (d.simulated) {
      const nt = newTask(d.create); nt.level = spec.level; nt.srcLabel = spec.label;
      if (spec.mode === 'Adapt') { nt.src = spec.source; nt.sourceFile = spec.fileName; nt.srcLevel = spec.srcLevel; nt.srcLevelSource = spec.srcLevelSource; nt.srcEstimate = spec.srcEstimate; nt.dir = spec.direction; } else { nt.brief = spec.brief; nt.dir = ty; nt.src = `${spec.brief.situation}\nTheme: ${th} · Text type: ${ty}.`; }
      S.tasks.push(nt); S.newMode = null; S.file = null; S.formErr = ''; S.current = nt.id; go('evaluate'); return;
    }
    S.busy = true; S.formErr = ''; render();
    generateTask(spec).then(nt => { S.tasks.push(nt); queueJudge(nt); S.busy = false; S.newMode = null; S.file = null; S.current = nt.id; go('evaluate'); })
      .catch(err => { S.busy = false; S.formErr = err.message; render(); });
    return;
  }

  if (d.simulate) { const b = document.querySelector('[data-create]'); if (b) { b.dataset.simulated = '1'; b.click(); delete b.dataset.simulated; } return; }
  if (d.htab) { S.homeTab = S.homeTab === d.htab ? 'all' : d.htab; render(); return; }
  if (d.eval) { S.current = +d.eval; go('evaluate', { toast: '' }); return; }
  if (d.del) {
    const id = +d.del;
    if (S.confirmDel !== id) { S.confirmDel = id; render(); return; }
    S.tasks = S.tasks.filter(x => x.id !== id); S.confirmDel = null; if (S.current === id) S.current = null; render(); return;
  }
  if (S.confirmDel) S.confirmDel = null;
  if (d.lvl) { S.level = d.lvl; S.formErr = ''; render(); return; }
  if (d.srclvl) { S.srcLevel = d.srclvl; S.srcLevelSource = 'given'; S.formErr = ''; render(); return; }
  if (d.estimate && S.file && !S.estimating) {
    S.estimate = null; S.formErr = '';
    if (!judgeReady()) { S.srcLevel = 'Unknown'; S.srcLevelSource = 'unknown'; render(); return; }
    S.estimating = true; render();
    estimateLevel(S.file.text).then(e => { S.estimate = e; S.srcLevel = e.level; S.srcLevelSource = 'estimated'; })
      .catch(err => { S.estimate = { error: err.message }; S.srcLevel = 'Unknown'; S.srcLevelSource = 'unknown'; }).finally(() => { S.estimating = false; render(); });
    return;
  }
  if (d.resume) { S.current = +d.resume; S.animate = true; go('adapt', { toast: '' }); return; }
  if (d.rate && t && t.status === 'to-evaluate') {
    const val = isNaN(+d.val) ? d.val : +d.val, r = t.ev.r;
    r[d.rate] = val;
    if (d.rate.endsWith('1')) { const dk = d.rate[0] + 'd'; if (val === 5) r[dk] = 'On target'; else if (r[dk] === 'On target') delete r[dk]; }
    t.ev.bestManual = false; S.err = ''; autoBest(t); render(); return;
  }
  if (d.regv && t) { t.ev.reg[d.regv] = t.ev.reg[d.regv] === d.val ? '' : d.val; render(); return; }
  if (d.best && t && t.status === 'to-evaluate' && isComplete(t)) { t.ev.best = d.best; t.ev.bestManual = true; S.err = ''; render(); return; }
  if (d.validateEval && t) {
    const need = ['A1', 'A2', 'A3', 'B1', 'B2', 'B3', 'Ad', 'Bd'];
    if (need.some(k => t.ev.r[k] === undefined) || !t.ev.best) { S.err = 'Rate both versions and choose the better one first.'; render(); return; }
    t.status = 'adapting'; t.ev.validatedAt = new Date().toISOString(); t.ev.blind = !(isAdmin() && t.A.model); S.animate = true; go('adapt', { toast: '' }); return;
  }
  if (d.final && t && t.status === 'adapting') { ensureEdits(t); t.finalSide = d.final; S.yourErr = ''; render(); return; }
  if (d.restore && t && t.status === 'adapting') { ensureEdits(t); t.edit[d.restore] = t[d.restore].text; render(); return; }
  if (d.corpus && t) {
    ensureEdits(t);
    if (!t.finalSide) { S.yourErr = 'Choose the final version first: click Use as final above A or B.'; render(); return; }
    if (!t.edit[t.finalSide].trim()) { S.yourErr = 'The final version is empty.'; render(); return; }
    t.your = t.edit[t.finalSide];
    t.status = 'done'; t.validatedAt = new Date().toISOString(); t.dist = { A: wordDistance(t.your, t.A.text), B: wordDistance(t.your, t.B.text) };
    queueJudge(t); nextAfter(`Task ${t.id} added to the silver corpus.`); return;
  }
  if (d.export) {
    if (!S.tasks.some(x => finalRecords(x).length)) { S.toast = 'No validated text to export yet.'; render(); return; }
    download(`adapt-cefr-corpus-${stamp()}.jsonl`, corpusJsonl(), 'application/x-ndjson'); return;
  }
  if (d.csv) { download(`adapt-cefr-analysis-${stamp()}.csv`, toCsv(analysisRows()), 'text/csv'); return; }
  if (d.runjudge) { judgeMissing().forEach(queueJudge); render(); return; }
  if (d.mkbatch) {
    const unb = S.tasks.filter(x => !x.batch && x.A && x.B); if (!unb.length) return;
    S.settings.batchSeq += 1; const b = 'B' + S.settings.batchSeq;
    unb.forEach(x => { x.batch = b; x.uid = x.uid || `${S.settings.installId}-${x.id}`; });
    S.toast = `Batch ${b} created with ${unb.length} text${unb.length === 1 ? '' : 's'}.`; render(); return;
  }
  if (d.bexport) { download(`adapt-cefr-batch-${d.bexport}-${stamp()}.json`, JSON.stringify(batchFile(d.bexport), null, 2), 'application/json'); return; }
  if (d.exportres) {
    if (!S.settings.annotator.trim()) { S.toast = 'Set your annotator pseudonym in Settings first.'; render(); return; }
    const rf = resultsFile(); if (!rf.results.length) { S.toast = 'No evaluated text to export yet.'; render(); return; }
    download(`adapt-cefr-results-${S.settings.annotator.trim().replace(/[^\w-]+/g, '_')}-${stamp()}.json`, JSON.stringify(rf, null, 2), 'application/json'); return;
  }
  if (d.proflv) { S.profLevel = d.proflv; S.profOpen = true; render(); return; }
  if (d.profsave) { const v = saveProfiles(S.profDraft); if (v) S.toast = `Level profiles saved as ${v}.`; S.profOpen = true; render(); return; }
  if (d.profdiscard) { S.profDraft = null; S.profErr = ''; S.profOpen = true; render(); return; }
  if (d.profreset) { S.profDraft = JSON.parse(JSON.stringify(PROFILES)); S.profErr = ''; S.profOpen = true; render(); return; }
  if (d.psave) { const v = savePrompts(S.promptDraft); if (v) S.toast = `Prompt saved as ${v}.`; S.promptOpen = true; render(); return; }
  if (d.pdiscard) { S.promptDraft = null; S.promptErr = ''; S.promptOpen = true; render(); return; }
  if (d.preset) { S.promptDraft = Object.assign({}, DEFAULT_PROMPTS[S.settings.language]); S.promptErr = ''; S.promptOpen = true; render(); return; }
  if (d.savekeys) { S.keysSaved = true; saveKeys(); S.toast = 'Keys saved in this browser.'; render(); return; }
  if (d.forgetkeys) { S.keysSaved = false; S.keys = {}; try { localStorage.removeItem(LS_KEYS); } catch (e) { /* nothing stored */ } S.toast = 'Keys deleted from this browser.'; render(); return; }
  if (d.backup) { download(`adapt-cefr-backup-${stamp()}.json`, JSON.stringify(snapshot(), null, 2), 'application/json'); return; }
  if (d.wipe) {
    if (!S.confirmWipe) { S.confirmWipe = true; render(); return; }
    S.tasks = []; S.seq = 0; S.confirmWipe = false; Object.assign(S, { current: null }); S.toast = 'All data deleted.'; render(); return;
  }
  if (d.test !== undefined) {
    const m = S.settings.models[+d.test]; S.testFull = S.testFull || {}; S.testMsg[d.test] = 'Testing…'; S.testFull[d.test] = ''; render();
    const short = msg => /no API key/.test(msg) ? 'No key' : /no model ID/.test(msg) ? 'No model ID' : /HTTP 401|HTTP 403/.test(msg) ? 'Invalid key' : /HTTP 402/.test(msg) ? 'No credit' : /HTTP 404|not a valid model|No endpoints/i.test(msg) ? 'Unknown model' : /HTTP 429/.test(msg) ? 'Rate limit' : /network|CORS|reach/i.test(msg) ? 'Network error' : /empty answer/.test(msg) ? 'Empty answer' : (msg.match(/HTTP \d+/) || ['Error'])[0];
    if (m.providerType === 'openrouter' && m.modelId) openRouterPrices().then(map => {
      const p = map[m.modelId]; if (!p) return;
      if (!m.priceIn || m.priceAuto) { m.priceIn = priceTxt(p.in); m.priceOut = priceTxt(p.out); m.priceAuto = true; save(); render(); }
    }).catch(() => { /* price list unavailable: prices stay as they are */ });
    callModel(m, 'You are a test.', 'Reply with the single word OK.', { temperature: 0, seed: 1, maxTokens: 1000 })
      .then(r => { S.testMsg[d.test] = `OK · ${(r.latencyMs / 1000).toFixed(1)} s${r.cost.usd !== null ? ' · ' + fmtUsd(r.cost.usd) : ''}`; S.testFull[d.test] = `OK · ${r.latencyMs} ms · ${r.returnedModel} · ${r.usage.in} in / ${r.usage.out} out tokens · ${r.cost.usd !== null ? fmtUsd(r.cost.usd) + ' ' + r.cost.kind : 'cost unknown'}`; render(); })
      .catch(err => { S.testMsg[d.test] = short(err.message); S.testFull[d.test] = err.message; render(); });
    return;
  }
});
document.addEventListener('input', e => {
  if (e.target.id === 'themeOther') { S.themeOther = e.target.value; S.formErr = ''; return; }
  if (e.target.id === 'typeOther') { S.typeOther = e.target.value; S.formErr = ''; return; }
  if (e.target.id === 'situation') { S.situation = e.target.value; S.formErr = ''; return; }
  if (e.target.id === 'annotator') { S.settings.annotator = e.target.value; save(); return; }
  if (e.target.dataset.mv !== undefined) { const m = S.settings.models[+e.target.dataset.mv]; m.modelId = e.target.value.trim(); if (m.priceAuto) { m.priceIn = m.priceOut = ''; m.priceAuto = false; const i = e.target.dataset.mv; ['in', 'out'].forEach(k => { const f = document.querySelector(`[data-price${k}="${i}"]`); if (f) f.value = ''; }); } save(); return; }
  if (e.target.dataset.pricein !== undefined || e.target.dataset.priceout !== undefined) { const isIn = e.target.dataset.pricein !== undefined, m = S.settings.models[+(isIn ? e.target.dataset.pricein : e.target.dataset.priceout)]; m[isIn ? 'priceIn' : 'priceOut'] = e.target.value.trim().replace(',', '.'); m.priceAuto = false; e.target.style.color = ''; save(); return; }
  if (e.target.id === 'tempIn') { const v = parseFloat(e.target.value); if (!isNaN(v) && v >= 0 && v <= 2) { S.settings.temperature = v; save(); } return; }
  if (e.target.dataset.prof) {
    const k = e.target.dataset.prof, num = PROF_NUM.some(x => x[0] === k);
    profSet(S.profDraft[S.profLevel || 'B1'], k, S.settings.language, num ? parseInt(e.target.value, 10) : e.target.value); S.profErr = '';
    const changed = JSON.stringify(S.profDraft) !== JSON.stringify(activeProfiles());
    document.querySelectorAll('[data-profsave],[data-profdiscard]').forEach(b => { b.disabled = !changed; }); return;
  }
  if (e.target.dataset.pf) {
    S.promptDraft[e.target.dataset.pf] = e.target.value; S.promptErr = '';
    const changed = PROMPT_FIELDS.some(([k]) => S.promptDraft[k] !== currentPrompts()[k]);
    document.querySelectorAll('[data-psave],[data-pdiscard]').forEach(b => { b.disabled = !changed; }); return;
  }
  if (e.target.dataset.mk !== undefined) { S.keys[S.settings.models[+e.target.dataset.mk].model] = e.target.value; saveKeys(); return; }
  const t = cur(); if (!t) return;
  if (e.target.id === 'why') { t.ev.why = e.target.value; save(); }
  if (e.target.dataset.edit && t.status === 'adapting') {
    const v = e.target.dataset.edit; ensureEdits(t); t.edit[v] = e.target.value; $('chips' + v).innerHTML = liveChips(t, t.edit[v]);
    const rb = document.querySelector(`[data-restore="${v}"]`); if (rb) rb.disabled = t.edit[v] === t[v].text; save();
  }
});
document.addEventListener('change', e => {
  if (e.target.dataset.dirv) { const t2 = cur(); if (t2 && t2.status === 'to-evaluate') { t2.ev.r[e.target.dataset.dirv + 'd'] = e.target.value; t2.ev.bestManual = false; autoBest(t2); render(); } return; }
  if (e.target.id === 'pairSel') { S.pair = e.target.value; return; }
  if (e.target.dataset.mp !== undefined) { const m = S.settings.models[+e.target.dataset.mp]; m.providerType = e.target.value; if (m.priceAuto) { m.priceIn = m.priceOut = ''; m.priceAuto = false; } save(); render(); return; }
  if (e.target.id === 'roleSel') { S.settings.role = e.target.value; S.newMode = null; render(); return; }
  if ((e.target.id === 'batchIn' || e.target.id === 'resultsIn') && e.target.files.length) {
    const files = [...e.target.files], isBatch = e.target.id === 'batchIn'; let total = 0, bad = 0, done = 0;
    files.forEach(f => { const r = new FileReader(); r.onload = () => {
      try { const d = JSON.parse(String(r.result));
        if (!APP_IDS.includes(d.app) || d.kind !== (isBatch ? 'batch' : 'results')) throw new Error('wrong file');
        total += isBatch ? importBatch(d) : importResults(d); }
      catch (err) { bad++; }
      if (++done === files.length) { if (!isBatch) S.tasks.forEach(queueJudge); S.toast = (isBatch ? `${total} new text${total === 1 ? '' : 's'} imported.` : `Results imported for ${total} text${total === 1 ? '' : 's'}.`) + (bad ? ` ${bad} file${bad === 1 ? ' is' : 's are'} not an Adapt-CEFR ${isBatch ? 'batch' : 'results'} file.` : ''); render(); }
    }; r.readAsText(f); });
    e.target.value = ''; return;
  }
  if (e.target.id === 'corpusLang') { S.settings.language = e.target.value; S.promptDraft = null; S.profDraft = null; render(); return; }
  if (e.target.id === 'restoreIn' && e.target.files[0]) {
    const r = new FileReader();
    r.onload = () => {
      try { const d = JSON.parse(String(r.result)); if (!APP_IDS.includes(d.app) || !Array.isArray(d.tasks)) throw new Error('not a backup');
        applyData(d); Object.assign(S, uiDefaults()); S.view = 'settings'; S.toast = `Backup restored: ${S.tasks.length} tasks.`; }
      catch (err) { S.toast = 'This file is not an Adapt-CEFR backup.'; }
      render();
    };
    r.readAsText(e.target.files[0]); return;
  }
  if (e.target.id === 'theme') { S.theme = e.target.value; S.formErr = ''; render(); return; }
  if (e.target.id === 'type') { S.type = e.target.value; S.formErr = ''; render(); return; }
  if (e.target.id === 'fileIn' && e.target.files[0]) {
    const f = e.target.files[0], r = new FileReader();
    r.onload = () => { const text = String(r.result); S.file = { name: f.name, text: text, words: text.trim() ? text.trim().split(/\s+/).length : 0 }; S.formErr = ''; S.fileErr = ''; S.level = null; S.estimate = null; if (S.srcLevel === 'Unknown') S.srcLevel = 'C1'; S.srcLevelSource = 'given'; render(); };
    r.readAsText(f); return;
  }
  const t = cur(); if (!t) return;
  if (e.target.dataset.errv) { const v = e.target.dataset.errv, arr = t.ev.err[v]; if (e.target.checked) arr.push(e.target.value); else arr.splice(arr.indexOf(e.target.value), 1); render(); }
});
window.addEventListener('pagehide', () => { clearTimeout(saveTimer); persist(); });
document.addEventListener('toggle', e => { if (e.target.id === 'promptBox') S.promptOpen = e.target.open; if (e.target.id === 'profBox') S.profOpen = e.target.open; }, true);
boot();
</script>
